name: Update KINO database

on:
  schedule:
    - cron: "30 0 * * *"   # every day at 00:30 UTC = 06:00 AM IST
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}   # optional; movies are skipped without it
        run: python scripts/update_db.py

      - name: Commit and push if changed
        run: |
          git config user.name "kino-bot"
          git config user.email "kino-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: daily update $(date -u +%F)"
            git push
          fi
